name: wine_hgb
seed: 11
task: classification
metric: accuracy

data:
  source: sklearn:wine
  test_size: 0.25
  scale: true

model:
  name: hist_gradient_boosting

search:
  n_trials: 30
  timeout_seconds: 600
  trial_time_budget: 15
  cv_folds: 4
  objectives: [val_score, train_time, model_size]
  sampler: auto
  early_stopping: true
  params:
    max_iter: [50, 300]
    learning_rate: [0.02, 0.3]
    max_leaf_nodes: [7, 63]
    min_samples_leaf: [3, 40]
    l2_regularization: [0.0, 1.0]

constraints:
  train_time: { max: 10.0 }
  model_size: { max: 5000000 }

selection:
  weights:
    val_score: 1.0
    train_time: 0.3
    model_size: 0.2
  require_constraints: true
