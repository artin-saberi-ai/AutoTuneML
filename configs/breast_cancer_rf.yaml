name: breast_cancer_rf
seed: 7
task: classification
metric: accuracy

data:
  source: sklearn:breast_cancer
  target: target
  test_size: 0.2
  impute: median
  scale: true

model:
  name: random_forest
  params:
    n_jobs: -1

search:
  n_trials: 40
  timeout_seconds: 600
  trial_time_budget: 30
  cv_folds: 5
  objectives: [val_score]
  sampler: auto
  pruner: median
  params:
    n_estimators: [100, 600]
    max_depth: [3, 30]
    min_samples_leaf: [1, 20]
    max_features: ["sqrt", "log2"]
