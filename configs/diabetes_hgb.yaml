name: diabetes_hgb
seed: 3
task: regression
metric: rmse

data:
  source: sklearn:diabetes
  test_size: 0.2
  impute: median
  scale: true

model:
  name: hist_gradient_boosting
  params:
    max_iter: 300

search:
  n_trials: 25
  timeout_seconds: 600
  trial_time_budget: 20
  cv_folds: 5
  objectives: [val_score, train_time]
  sampler: auto
  pruner: median
  params:
    max_iter: [50, 400]
    learning_rate: [0.01, 0.3]
    max_leaf_nodes: [15, 127]
    min_samples_leaf: [5, 60]
    l2_regularization: [0.0, 2.0]

constraints:
  train_time: { max: 8.0 }

selection:
  weights:
    val_score: 1.0
    train_time: 0.4
  require_constraints: true
